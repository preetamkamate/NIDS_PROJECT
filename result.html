<!DOCTYPE html>
<html>
<head>
    <title>Prediction Results</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1, h2 {
            margin-bottom: 15px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            margin-bottom: 30px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .prediction {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .back {
            display: inline-block;
            padding: 10px 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>Prediction Results</h1>

<p>
    <strong>Uploaded File:</strong> {{ filename }}
</p>

<p>
    <strong>Total Records:</strong> {{ total_records }}
</p>

<h2>Prediction Summary</h2>

{{ summary_table | safe }}

<h2>SHAP Explanation</h2>

<p class="prediction">
    First Record Prediction: {{ first_prediction }}
</p>

<p>
    Top 10 features influencing the prediction:
</p>

{{ shap_table | safe }}

<br>

<a href="/" class="back">Upload Another CSV</a>

</body>
</html>
